apiVersion: v1
kind: Secret
metadata:
  name: mailer-secrets
  labels:
    app.kubernetes.io/name: mailer-platform
type: Opaque
stringData:
  # Database password for DB_USER
  DB_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"

  # Redis password (leave empty string if your external Redis doesn't require AUTH)
  REDIS_PASSWORD: ""

  # AES-256-GCM symmetric key used to encrypt SMTP passwords (MUST BE EXACTLY 32 CHARACTERS)
  SMTP_ENCRYPTION_KEY: "change_me_to_32_characters_key!!"

  # JWT signing secret for admin authentication
  JWT_SECRET: "change_me_jwt_production_secret_key_123456"
