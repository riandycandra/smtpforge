apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer-api
  labels:
    app.kubernetes.io/name: mailer-platform
    app.kubernetes.io/component: api
spec:
  # Start with 1 replica for migration safety; can be scaled up once initialized
  replicas: 1
  selector:
    matchLabels:
      app: mailer-api
  template:
    metadata:
      labels:
        app: mailer-api
    spec:
      containers:
        - name: api
          image: docker.io/riandycandra/mailer-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: mailer-config
            - secretRef:
                name: mailer-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mailer-api
  labels:
    app.kubernetes.io/name: mailer-platform
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: mailer-api
